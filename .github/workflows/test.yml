name: Test & Validate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate HTML
        run: |
          echo "Validating HTML structure..."
          grep -q "<!DOCTYPE html>" index.html || (echo "Missing DOCTYPE" && exit 1)
          grep -q "</html>" index.html || (echo "Missing closing html tag" && exit 1)
          echo "✅ HTML structure valid"
      
      - name: Check for required vulnerabilities
        run: |
          echo "Verifying vulnerabilities are present..."
          grep -q "AWS_ACCESS_KEY_ID" js/config.js || (echo "Missing AWS credentials" && exit 1)
          grep -q "JWT_SECRET" js/config.js || (echo "Missing JWT secret" && exit 1)
          grep -q "innerHTML" js/app.js || (echo "Missing innerHTML XSS" && exit 1)
          grep -q "GA_TRACKING_ID" js/analytics.js || (echo "Missing analytics keys" && exit 1)
          echo "✅ Vulnerabilities verified"
      
      - name: Check file structure
        run: |
          echo "Checking file structure..."
          test -f index.html || (echo "index.html missing" && exit 1)
          test -f css/styles.css || (echo "styles.css missing" && exit 1)
          test -f js/config.js || (echo "config.js missing" && exit 1)
          test -f js/api.js || (echo "api.js missing" && exit 1)
          test -f js/auth.js || (echo "auth.js missing" && exit 1)
          test -f js/app.js || (echo "app.js missing" && exit 1)
          test -f js/analytics.js || (echo "analytics.js missing" && exit 1)
          echo "✅ File structure valid"
      
      - name: Check documentation
        run: |
          echo "Checking documentation..."
          test -f README.md || (echo "README.md missing" && exit 1)
          test -f DEPLOYMENT.md || (echo "DEPLOYMENT.md missing" && exit 1)
          test -f SECURITY.md || (echo "SECURITY.md missing" && exit 1)
          echo "✅ Documentation complete"
      
      - name: Test local server
        run: |
          echo "Testing local server..."
          python3 -m http.server 8000 &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:8000/ > /dev/null || (echo "Server test failed" && exit 1)
          kill $SERVER_PID
          echo "✅ Server test passed"
      
      - name: Summary
        run: |
          echo "✅ All tests passed!"
          echo "VulnBank is ready for deployment"
