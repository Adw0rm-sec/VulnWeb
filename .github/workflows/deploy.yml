name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual deployment from GitHub UI

jobs:
  deploy:
    name: Deploy VulnBank to Hostinger
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js (for any build steps if needed)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Validate files
        run: |
          echo "Validating required files..."
          test -f index.html || (echo "index.html missing" && exit 1)
          test -f README.md || (echo "README.md missing" && exit 1)
          test -d css || (echo "css directory missing" && exit 1)
          test -d js || (echo "js directory missing" && exit 1)
          echo "✅ All required files present"
      
      - name: Create deployment package
        run: |
          echo "Creating deployment package..."
          mkdir -p deploy
          
          # Copy application files
          cp index.html deploy/
          cp -r css deploy/
          cp -r js deploy/
          cp robots.txt deploy/
          cp .htaccess deploy/ 2>/dev/null || echo "No .htaccess file"
          
          # Create deployment info file
          echo "Deployed at: $(date)" > deploy/DEPLOY_INFO.txt
          echo "Commit: ${{ github.sha }}" >> deploy/DEPLOY_INFO.txt
          echo "Branch: ${{ github.ref_name }}" >> deploy/DEPLOY_INFO.txt
          
          ls -la deploy/
      
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/README.md
            **/DEPLOYMENT.md
            **/CONTRIBUTING.md
            **/CHANGELOG.md
            **/SECURITY.md
            **/*.md
      
      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Site should be live at: ${{ secrets.SITE_URL }}"
      
      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Time: $(date)"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check the logs above for details"
