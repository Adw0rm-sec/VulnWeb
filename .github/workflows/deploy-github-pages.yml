name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual deployment

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Validate files
        run: |
          echo "Validating required files..."
          test -f index.html || (echo "index.html missing" && exit 1)
          test -d css || (echo "css directory missing" && exit 1)
          test -d js || (echo "js directory missing" && exit 1)
          echo "✅ All required files present"
      
      - name: Create deployment package
        run: |
          echo "Creating deployment package..."
          mkdir -p _site
          
          # Copy application files
          cp index.html _site/
          cp -r css _site/
          cp -r js _site/
          cp robots.txt _site/
          
          # Create deployment info
          echo "<!-- Deployed at: $(date) -->" >> _site/index.html
          echo "<!-- Commit: ${{ github.sha }} -->" >> _site/index.html
          
          # Create a simple 404 page
          cat > _site/404.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
        }
        h1 { font-size: 4em; margin: 0; }
        p { font-size: 1.5em; }
        a { color: white; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Page not found</p>
        <a href="/">Return to VulnBank</a>
    </div>
</body>
</html>
EOF
          
          ls -la _site/
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Deployment complete
        run: |
          echo "✅ Deployment successful!"
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"
